name: Native transfer PoC
on:
  push:
    branches: ["feature/*", "main"]
    paths: ["native/**", ".github/workflows/native-transfer.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native-transfer.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: google/boringssl
          ref: 594a44291086dcc7cef06cabec4c0b47afd674c0
          path: build/boringssl-source
          persist-credentials: false
      - name: Record toolchains and configure pinned sources
        run: |
          ulimit -c 0
          cmake --version
          clang --version
          go version
          cmake -S native/transfer -B build/sanitized -G Ninja \
            -DD2FA_BORINGSSL_SOURCE="$PWD/build/boringssl-source" \
            -DD2FA_TEST_API=ON -DD2FA_SANITIZE=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build wrapper and upstream unit tests
        run: cmake --build build/sanitized --target d2fa_core_test crypto_test ssl_test --parallel 2
      - name: Run wrapper with ASan and UBSan
        run: |
          ulimit -c 0
          ctest --test-dir build/sanitized --output-on-failure
      - name: Run upstream tests from their test-data root
        working-directory: build/boringssl-source
        run: |
          ulimit -c 0
          ../sanitized/boringssl/crypto_test
          ../sanitized/boringssl/ssl_test
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: google/boringssl
          ref: 594a44291086dcc7cef06cabec4c0b47afd674c0
          path: build/boringssl-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.11'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build Kotlin test peer and native JNI/CFFI core
        run: |
          ulimit -c 0
          python -m pip install -r native/poc/requirements.txt
          ./gradlew -p native/poc/kotlin jar --stacktrace
          cmake -S native/transfer -B build/interop -G Ninja \
            -DD2FA_BORINGSSL_SOURCE="$PWD/build/boringssl-source" \
            -DD2FA_TEST_API=ON -DD2FA_JNI=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/interop --target d2fa_core_test --parallel 2
      - name: Test shared native core and 1000 cross-language exchanges
        run: |
          ulimit -c 0
          ctest --test-dir build/interop --output-on-failure
          python native/poc/interop.py --library build/interop/libd2fa_transfer.so \
            --jar native/poc/kotlin/build/libs/d2fa-native-interop-poc.jar
      - name: Verify non-test exports without rebuilding dependency sources
        run: |
          cmake -S native/transfer -B build/interop -DD2FA_TEST_API=OFF
          cmake --build build/interop --target d2fa_transfer --parallel 2
          python native/poc/verify_exports.py build/interop/libd2fa_transfer.so
  desktop-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: google/boringssl
          ref: 594a44291086dcc7cef06cabec4c0b47afd674c0
          path: build/boringssl-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.11'
      - uses: gradle/actions/setup-gradle@v3
      - name: Set up pinned Windows assembler
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@e77cc62a22a374a4d0668286007cc3e3b4c17760
        with:
          version: 2.16.03
          from-source: 'false'
      - name: Build Windows host JNI/CFFI peer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -r native/poc/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gradlew.bat -p native/poc/kotlin jar --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S native/transfer -B build/platform -G "Visual Studio 17 2022" -A x64 -DD2FA_BORINGSSL_SOURCE="$PWD/build/boringssl-source" -DD2FA_TEST_API=ON -DD2FA_JNI=ON -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/platform --config Release --target d2fa_core_test --parallel 2
          exit $LASTEXITCODE
      - name: Verify Windows host profile and exports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ctest --test-dir build/platform -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/poc/interop.py --library build/platform/Release/d2fa_transfer.dll --jar native/poc/kotlin/build/libs/d2fa-native-interop-poc.jar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S native/transfer -B build/platform -DD2FA_TEST_API=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/platform --config Release --target d2fa_transfer --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python native/poc/verify_exports.py build/platform/Release/d2fa_transfer.dll
          exit $LASTEXITCODE
      - name: Build macOS host JNI/CFFI peer
        if: runner.os == 'macOS'
        run: |
          python -m pip install -r native/poc/requirements.txt
          ./gradlew -p native/poc/kotlin jar --stacktrace
          cmake -S native/transfer -B build/platform -G Ninja \
            -DD2FA_BORINGSSL_SOURCE="$PWD/build/boringssl-source" \
            -DD2FA_TEST_API=ON -DD2FA_JNI=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/platform --target d2fa_core_test --parallel 2
      - name: Verify macOS host profile and exports
        if: runner.os == 'macOS'
        run: |
          ctest --test-dir build/platform --output-on-failure
          python native/poc/interop.py --library build/platform/libd2fa_transfer.dylib \
            --jar native/poc/kotlin/build/libs/d2fa-native-interop-poc.jar
          cmake -S native/transfer -B build/platform -DD2FA_TEST_API=OFF
          cmake --build build/platform --target d2fa_transfer --parallel 2
          python native/poc/verify_exports.py build/platform/libd2fa_transfer.dylib

      - name: Retain non-test developer binary and license notices
        uses: actions/upload-artifact@v4
        with:
          name: developer-transfer-core-${{ runner.os }}-${{ runner.arch }}
          retention-days: 3
          if-no-files-found: error
          path: |
            build/platform/Release/d2fa_transfer.dll
            build/platform/libd2fa_transfer.dylib
            native/transfer/core.h
            LICENSE
            build/boringssl-source/LICENSE
