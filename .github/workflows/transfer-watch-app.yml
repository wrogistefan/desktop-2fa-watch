name: Optional Watch native core
on:
  push:
    branches: ["feature/*", "main"]
    paths: ["native/**", "app/build.gradle.kts", "app/transfer-native-rules.pro", "app/src/main/AndroidManifest.xml", ".github/workflows/transfer-watch-app.yml"]
  pull_request:
    paths: ["native/**", "app/build.gradle.kts", "app/transfer-native-rules.pro", "app/src/main/AndroidManifest.xml", ".github/workflows/transfer-watch-app.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: google/boringssl
          ref: 594a44291086dcc7cef06cabec4c0b47afd674c0
          path: build/boringssl-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
      - name: Install pinned native toolchains
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Ordinary app stays offline without native payload
        run: |
          ./gradlew :app:assembleDebug --stacktrace
          python native/poc/verify_android_poc.py app/build/outputs/apk/debug/app-debug.apk --watch-app --without-native --offline
      - name: Explicit optional core builds all three ABIs with test API off
        run: |
          ./gradlew -Pd2faTransferNative=true -Pd2faBoringSSLSource="$PWD/build/boringssl-source" :app:assembleDebug --stacktrace
          python native/poc/verify_android_poc.py app/build/outputs/apk/debug/app-debug.apk --watch-app --offline
      - name: Turning option off cannot retain stale native libraries or notices
        run: |
          ./gradlew -Pd2faTransferNative=false :app:assembleDebug --stacktrace
          python native/poc/verify_android_poc.py app/build/outputs/apk/debug/app-debug.apk --watch-app --without-native --offline
